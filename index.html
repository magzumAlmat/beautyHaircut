<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Haircut Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; min-height: 100vh; }
  
  .app { max-width: 900px; margin: 0 auto; padding: 2rem; }
  
  header { text-align: center; padding: 1.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 1.5rem; }
  h1 { font-size: 1.8rem; background: linear-gradient(90deg, #f093fb 0%,#f5576c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.25rem; }
  
  .upload-zone { border: 3px dashed rgba(255,255,255,0.3); padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s ease; border-radius: 12px; margin-bottom: 1.5rem; }
  .upload-zone:hover, .upload-zone.dragover { background: rgba(240, 147, 251, 0.1); border-color: #f093fb; transform: scale(1.02); }
  .upload-zone span { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
  .upload-zone p { color: rgba(255,255,255,0.6); }
  
  .preview-container { background: rgba(0,0,0,0.3); padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
  .preview-image { max-width: 100%; max-height: 400px; border-radius: 8px; display: none; }
  
  .styles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
  .style-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1rem; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; text-align: left; }
  .style-card:hover { background: rgba(240, 147, 251, 0.15); border-color: #f093fb; transform: translateY(-2px); }
  .style-card.selected { background: linear-gradient(135deg, #f093fb 0%,#a855f7 100%); border-color: #c084fc; box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3); }
  .style-card h4 { margin-bottom: 0.25rem; font-size: 0.9rem; }
  .style-card p { color: rgba(255,255,255,0.6); font-size: 0.8rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  
  .buttons { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1rem; }
  button { padding: 0.6rem 1.5rem; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; font-weight: 600; }
  .btn-primary { background: linear-gradient(135deg, #f093fb 0%,#a855f7 100%); color: white; box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  
  #loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
  #loading.visible { display: flex; }
  .spinner { width: 50px; height: 50px; border: 3px solid rgba(240,147,251,0.3); border-top-color: #f093fb; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .categories { display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.25rem; }
  .category-pill { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.1); padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.8rem; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
  .category-pill:hover { background: rgba(255,255,255,0.15); }
  .category-pill.active { background: linear-gradient(135deg, #f093fb 0%,#a855f7 100%); color: white; border-color: #c084fc; }

  .hidden-input { display: none; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>✂️ Beauty Haircut Generator</h1>
    <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">Пепельные волосы + стильная прическа за 3 секунды</p>
  </header>

  <!-- Категории -->
  <div class="categories" id="categories"></div>

  <!-- Загрузка фото -->
  <div class="upload-zone" id="dropZone">
    <span>📁</span>
    <p>Перетащите фото сюда или кликните для выбора файла</p>
    <small style="color: rgba(255,255,255,0.4); font-size: 0.8rem;">JPG, PNG, WebP • макс. 10 MB</small>
    <input type="file" class="hidden-input" accept="image/*" onchange="handleFileSelect(this.files[0])">
  </div>

  <!-- Категории стилей -->
  <div class="styles-grid" id="stylesGrid"></div>

  <!-- Кнопки -->
  <div class="buttons" id="actionButtons" style="display:none;">
    <button class="btn-primary" onclick="applyStyle()" id="applyBtn">✨ Применить прическу</button>
    <button class="btn-secondary" onclick="reset()">🔄 Сбросить</button>
  </div>

  <!-- Предпросмотр -->
  <div class="preview-container" id="previewContainer" style="display:none;">
    <p style="color: rgba(255,255,255,0.6); margin-bottom: 0.5rem;">Предпросмотр:</p>
    <img id="previewImg" class="preview-image">
  </div>

  <!-- Результат -->
  <div class="preview-container" id="resultContainer" style="display:none;">
    <h3 style="margin-bottom:0.5rem; color:#f093fb;">✨ Результат</h3>
    <img id="resultImg" class="preview-image">
    <a id="downloadLink" href="#" download="haircut.png" 
       style="display:inline-block;margin-top:0.75rem;padding:0.4rem 1.2rem;background:rgba(255,255,255,0.1);border-radius:6px;color:white;text-decoration:none;font-size:0.85rem;">⬇️ Скачать</a>
  </div>

  <!-- Лоадер -->
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top:1rem;margin-bottom:0.25rem;">Генерация прически...</p>
    <small style="color: rgba(255,255,255,0.4)">Это может занять несколько секунд</small>
  </div>
</div>

<script>
// === ДАННЫЕ ===
const STYLES = [
  {id:'hollywood_waves', name:'Голливудские волны', cat:'evening'},
  {id:'high_bun', name:'Высокий пучок', cat:'evening'},
  {id:'low_bun', name:'Низкий пучок', cat:'evening'},
  {id:'greek_braid', name:'Греческая коса', cat:'evening'},
  {id:'french_twist', name:'Французский твист', cat:'evening'},
  {id:'bob', name:'Каре / Боб-каре', cat:'cuts'},
  {id:'cascade', name:'Каскад и Лесенка', cat:'cuts'},
  {id:'pixie', name:'Пикси', cat:'cuts'},
  {id:'wolfcut', name:'Вулфкат / Шегги', cat:'cuts'},
];

// === Состояние ===
let selectedStyle = null;
let imageFile = null;

// === Инициализация ===
function init() {
  // Категории
  const cats = [
    {id:'all', label:'Все ('+STYLES.length+')'},
    {id:'evening', label:'Вечерние и торжественные'},
    {id:'cuts', label:'Трендовые стрижки'},
  ];
  
  const catContainer = document.getElementById('categories');
  cats.forEach(cat => {
    const pill = document.createElement('div');
    pill.className = 'category-pill' + (cat.id === 'all' ? ' active' : '');
    pill.textContent = cat.label;
    pill.onclick = () => setCategory(cat.id);
    catContainer.appendChild(pill);
  });

  // Стили
  const grid = document.getElementById('stylesGrid');
  STYLES.forEach(style => {
    const card = document.createElement('div');
    card.className = 'style-card';
    card.innerHTML = `
      <h4>${style.name}</h4>
      <p style="color: rgba(255,255,255,0.6);font-size:0.8rem;">${catLabels[style.cat]}</p>
    `;
    card.onclick = () => selectStyle(style.id, card);
    grid.appendChild(card);
  });

  // Подписи категорий
  const catLabels = {'evening':'Вечерние', 'cuts':'Стрижки'};
}

function setCategory(id) {
  document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
  if (id === 'all') return;
  event.target.closest('.category-pill').classList.add('active');
  const cards = document.getElementById('stylesGrid').children;
  STYLES.forEach(s => {
    cards[s.id].style.display = id === 'all' ? '' : s.cat === id ? '' : 'none';
  });
}

function selectStyle(id, card) {
  selectedStyle = STYLES.find(s => s.id === id);
  document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
}

// === Загрузка файла ===
function handleFileSelect(file) {
  if (!file || !/image\/(png|jpg|jpeg|webp)/i.test(file.type)) {
    alert('Пожалуйста, выберите изображение (JPG, PNG или WebP)');
    return;
  }

  imageFile = file;
  
  // Скрываем зону загрузки и показываем предпросмотр
  document.getElementById('dropZone').style.display = 'none';
  document.getElementById('previewContainer').style.display = 'block';
  document.getElementById('actionButtons').style.display = 'flex';

  const url = URL.createObjectURL(file);
  document.getElementById('previewImg').src = url;
}

// === Применение прически ===
async function applyStyle() {
  if (!selectedStyle || !imageFile) return;

  // Показываем лоадер
  document.getElementById('loading').classList.add('visible');
  
  try {
    const formData = new FormData();
    formData.append('image', imageFile);
    formData.append('style_id', selectedStyle.id);

    const response = await fetch('/api/generate', {
      method: 'POST',
      body: formData,
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    
    // Показываем результат
    document.getElementById('resultContainer').style.display = 'block';
    const resultUrl = `${window.location.origin}/api/image/${data.filename}`;
    document.getElementById('resultImg').src = resultUrl;
    document.getElementById('downloadLink').href = resultUrl;

  } catch (error) {
    console.error(error);
    alert('Ошибка генерации: ' + error.message);
  } finally {
    document.getElementById('loading').classList.remove('visible');
  }
}

function reset() {
  selectedStyle = null;
  imageFile = null;
  
  // Скрываем все элементы
  document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('previewContainer').style.display = 'none';
  document.getElementById('resultContainer').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

// === Запуск ===
init();
</script>

</body>
</html>
